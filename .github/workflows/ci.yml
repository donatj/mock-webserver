on:
  - pull_request
  - push

name: CI

jobs:
  test:
    name: Tests

    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest, windows-latest]
        php-versions: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6']

    runs-on: ${{ matrix.operating-system }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: sockets, json, curl

    - name: Install dependencies with composer
      run: composer install

    - name: Test with phpunit
      run: vendor/bin/phpunit

    - name: Install PHPStan if PHP >= 7.4
      if: startsWith(matrix.php-versions, '7.4') || startsWith(matrix.php-versions, '8.')
      run: |
       composer require --dev phpstan/phpstan:2.2.2
       vendor/bin/phpstan

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: sockets, json, curl

    - name: Install dependencies with composer
      run: composer install

    - name: Install mddoc
      run: composer global require donatj/mddoc:0.13.0

    - name: Check documentation with mddoc
      run: $(composer global config bin-dir --absolute)/mddoc --dry-run=true mddoc.xml
